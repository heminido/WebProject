services:
  worker_remote:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      INSTANCE_NAME: "${REMOTE_WORKER_NAME:-worker-remote-1}"
      DB_HOST: "${REMOTE_DB_HOST:?Set REMOTE_DB_HOST}"
      DB_PORT: 5432
      DB_NAME: webproject
      DB_USER: webproject
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      WORKER_FILES_URL: "${REMOTE_FILES_URL:?Set REMOTE_FILES_URL}"
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET:?Set WORKER_SHARED_SECRET}"
      MAX_PPTX_MIB: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}"
      MAX_PDF_MIB: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}"
      MAX_ACTIVE_TASKS: "${MAX_ACTIVE_TASKS:?Set MAX_ACTIVE_TASKS in .env}"
      MAX_PPTX_ENTRIES: "${MAX_PPTX_ENTRIES:?Set MAX_PPTX_ENTRIES in .env}"
      MAX_UNCOMPRESSED_MIB: "${MAX_UNCOMPRESSED_MIB:?Set MAX_UNCOMPRESSED_MIB in .env}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:?Set CONVERSION_TIMEOUT_SECONDS in .env}"
    mem_limit: "${WORKER_MEMORY:?Set WORKER_MEMORY in .env}"
    cpus: ${WORKER_CPUS:?Set WORKER_CPUS in .env}
    init: true
    restart: unless-stopped
