services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webproject
      POSTGRES_USER: webproject
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webproject -d webproject"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api1:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: api-1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webproject
      DB_USER: webproject
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env}"
      UPLOAD_DIR: /app/uploads
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET:-}"
      MAX_PPTX_MIB: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}"
      MAX_PDF_MIB: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}"
      MAX_ACTIVE_TASKS: "${MAX_ACTIVE_TASKS:?Set MAX_ACTIVE_TASKS in .env}"
      MAX_PPTX_ENTRIES: "${MAX_PPTX_ENTRIES:?Set MAX_PPTX_ENTRIES in .env}"
      MAX_UNCOMPRESSED_MIB: "${MAX_UNCOMPRESSED_MIB:?Set MAX_UNCOMPRESSED_MIB in .env}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:?Set CONVERSION_TIMEOUT_SECONDS in .env}"
    volumes:
      - uploaded_documents:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api2:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: api-2
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webproject
      DB_USER: webproject
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env}"
      UPLOAD_DIR: /app/uploads
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET:-}"
      MAX_PPTX_MIB: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}"
      MAX_PDF_MIB: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}"
      MAX_ACTIVE_TASKS: "${MAX_ACTIVE_TASKS:?Set MAX_ACTIVE_TASKS in .env}"
      MAX_PPTX_ENTRIES: "${MAX_PPTX_ENTRIES:?Set MAX_PPTX_ENTRIES in .env}"
      MAX_UNCOMPRESSED_MIB: "${MAX_UNCOMPRESSED_MIB:?Set MAX_UNCOMPRESSED_MIB in .env}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:?Set CONVERSION_TIMEOUT_SECONDS in .env}"
    volumes:
      - uploaded_documents:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      INSTANCE_NAME: worker-1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webproject
      DB_USER: webproject
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env}"
      UPLOAD_DIR: /app/uploads
      MAX_PPTX_MIB: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}"
      MAX_PDF_MIB: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}"
      MAX_ACTIVE_TASKS: "${MAX_ACTIVE_TASKS:?Set MAX_ACTIVE_TASKS in .env}"
      MAX_PPTX_ENTRIES: "${MAX_PPTX_ENTRIES:?Set MAX_PPTX_ENTRIES in .env}"
      MAX_UNCOMPRESSED_MIB: "${MAX_UNCOMPRESSED_MIB:?Set MAX_UNCOMPRESSED_MIB in .env}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:?Set CONVERSION_TIMEOUT_SECONDS in .env}"
    volumes:
      - uploaded_documents:/app/uploads
    mem_limit: "${WORKER_MEMORY:?Set WORKER_MEMORY in .env}"
    cpus: ${WORKER_CPUS:?Set WORKER_CPUS in .env}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      INSTANCE_NAME: worker-2
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webproject
      DB_USER: webproject
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env}"
      UPLOAD_DIR: /app/uploads
      MAX_PPTX_MIB: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}"
      MAX_PDF_MIB: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}"
      MAX_ACTIVE_TASKS: "${MAX_ACTIVE_TASKS:?Set MAX_ACTIVE_TASKS in .env}"
      MAX_PPTX_ENTRIES: "${MAX_PPTX_ENTRIES:?Set MAX_PPTX_ENTRIES in .env}"
      MAX_UNCOMPRESSED_MIB: "${MAX_UNCOMPRESSED_MIB:?Set MAX_UNCOMPRESSED_MIB in .env}"
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:?Set CONVERSION_TIMEOUT_SECONDS in .env}"
    volumes:
      - uploaded_documents:/app/uploads
    mem_limit: "${WORKER_MEMORY:?Set WORKER_MEMORY in .env}"
    cpus: ${WORKER_CPUS:?Set WORKER_CPUS in .env}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    environment:
      CLIENT_MAX_PPTX_SIZE: "${MAX_PPTX_MIB:?Set MAX_PPTX_MIB in .env}m"
      CLIENT_MAX_PDF_SIZE: "${MAX_PDF_MIB:?Set MAX_PDF_MIB in .env}m"
      NGINX_ENVSUBST_FILTER: "^CLIENT_MAX_(PPTX|PDF)_SIZE$"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  postgres_data:
  uploaded_documents:
